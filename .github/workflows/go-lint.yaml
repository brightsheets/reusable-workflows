name: Go Lint

# Reusable golangci-lint run. Report-only by default; set fail-on-issues to fail the job.

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        description: Go version. Empty reads it from go.mod.
      golangci-lint-version:
        type: string
        default: latest
      generate:
        type: boolean
        default: false
        description: Run `go generate ./...` first.
      additional-tools:
        type: string
        description: Newline-separated `go install` targets (e.g. golang.org/x/tools/cmd/stringer@latest).
      fail-on-issues:
        type: boolean
        default: false
      go-private-owners:
        type: string
        description: Comma-separated owners whose private Go modules this repo needs.
      gh-app-id:
        type: string
    secrets:
      go-modules-token:
        required: false
      gh-app-private-key:
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: GitHub App token for private modules
        id: app-token
        if: inputs.go-private-owners != '' && inputs.gh-app-id != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ inputs.gh-app-id }}
          private-key: ${{ secrets.gh-app-private-key }}
          owner: ${{ inputs.go-private-owners }}

      - name: Configure private Go modules
        if: inputs.go-private-owners != ''
        env:
          OWNERS: ${{ inputs.go-private-owners }}
          TOKEN: ${{ secrets.go-modules-token || steps.app-token.outputs.token }}
        run: |
          goprivate=$(tr ', ' '\n\n' <<<"$OWNERS" | sed '/^$/d; s#^#github.com/#; s#$#/*#' | paste -sd, -)
          echo "GOPRIVATE=$goprivate" >> "$GITHUB_ENV"
          if [[ -z "$TOKEN" ]]; then
            echo "::warning title=No token for private modules::Set go-modules-token (or a GitHub App). Only public modules will resolve."
            exit 0
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}

      - name: Install additional tools
        if: inputs.additional-tools != ''
        env:
          TOOLS: ${{ inputs.additional-tools }}
        run: |
          while read -r tool; do
            [[ -n "$tool" ]] && go install "$tool"
          done <<<"$TOOLS"

      - name: go generate
        if: inputs.generate
        run: go generate ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        continue-on-error: ${{ !inputs.fail-on-issues }}
        with:
          version: ${{ inputs.golangci-lint-version }}
