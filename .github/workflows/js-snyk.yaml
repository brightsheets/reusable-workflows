name: JavaScript Snyk Scan

# Reusable Snyk scan for a JavaScript project (npm or pnpm): Open Source (dependencies) and
# Code (SAST).
# - Report-only by default: findings go to GitHub Code Scanning (SARIF) and a PR comment.
#   Set fail-on-issues to turn it into a quality gate.
# - monitor: also publishes results to Snyk (`snyk monitor`, `snyk code test --report`),
#   attributed to this repo and branch. Meant for the default branch and hotfix/* only.
# - Monorepos (npm/yarn workspaces, pnpm-workspace.yaml with packages) aren't supported.
# - Without a snyk-token the Snyk steps are skipped with a warning, so the build still passes.
#
# Caller job permissions: contents: read, actions: read, security-events: write,
# pull-requests: write. With monitor, the token's role also needs "View Project Ignores".

on:
  workflow_call:
    inputs:
      runner-labels-json:
        type: string
        default: '["ubuntu-24.04"]'
        description: JSON list of runner labels, used as-is for `runs-on`.
      node-version:
        type: string
        default: lts/*
      pnpm:
        type: boolean
        default: false
      pnpm-version:
        type: string
        default: "10"
      working-directory:
        type: string
        default: .
        description: Directory with package.json. Package manager and Snyk commands run from here.
      strict-lockfile:
        type: boolean
        default: true
      fail-on-issues:
        type: boolean
        default: false
        description: Fail the job on findings at or above severity-threshold, or when a scan doesn't complete.
      severity-threshold:
        type: string
        default: high
        description: low | medium | high | critical (Snyk Code runs `critical` as `high`).
      monitor:
        type: boolean
        default: false
        description: Publish results to the Snyk platform.
      project-name:
        type: string
        description: Snyk Code project name when monitor is true. Defaults to owner/repo.
      snyk-org:
        type: string
        description: Snyk org ID or slug (--org). Defaults to the caller repo's GitHub owner.
    secrets:
      snyk-token:
        required: false
        description: Snyk token. Without it the scans are skipped with a warning.

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

jobs:
  snyk:
    name: Snyk Scan
    runs-on: ${{ fromJson(inputs.runner-labels-json) }}
    env:
      NPM: ${{ inputs.pnpm && 'pnpm' || 'npm' }}
      SNYK_ORG: ${{ inputs.snyk-org || github.repository_owner }}
      SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
      PROJECT_NAME: ${{ inputs.project-name || github.repository }}
      REMOTE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      TARGET_REFERENCE: ${{ github.head_ref || github.ref_name }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for a Snyk token
        id: token
        env:
          SNYK_TOKEN: ${{ secrets.snyk-token }}
        run: |
          if [[ -z "$SNYK_TOKEN" ]]; then
            echo "::warning title=Snyk skipped::No Snyk token was passed. Add a SNYK_TOKEN secret to this repo to turn the Snyk scan on."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      # Pinned; Dependabot only tracks `uses:` lines, so bump these by hand.
      - name: Install Snyk CLI${{ inputs.pnpm && ' and pnpm' || '' }}
        if: steps.token.outputs.present == 'true'
        uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            snyk = "1.1308.4"
            ${{ inputs.pnpm && format('pnpm = "{0}"', inputs.pnpm-version) || '' }}

      - name: Check project layout
        id: layout
        if: steps.token.outputs.present == 'true'
        run: |
          if node -e 'process.exit(require("./package.json").workspaces ? 0 : 1)'; then
            echo "::error title=Snyk monorepo::package.json has workspaces. Monorepos aren't supported."
            exit 1
          fi
          if [[ -f pnpm-workspace.yaml ]] && grep -q '^packages:' pnpm-workspace.yaml; then
            echo "::error title=Snyk monorepo::pnpm-workspace.yaml lists packages. Monorepos aren't supported."
            exit 1
          fi
          # A pnpm-workspace.yaml without packages (settings only) still needs --all-projects.
          if [[ "$NPM" == "pnpm" && -f pnpm-workspace.yaml ]]; then
            echo "all-projects=true" >> "$GITHUB_OUTPUT"
          else
            echo "all-projects=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the package cache directory
        id: cache-dir
        if: steps.token.outputs.present == 'true'
        run: |
          if [[ "$NPM" == "pnpm" ]]; then dir=$(pnpm store path); else dir=$(npm config get cache); fi
          echo "path=$dir" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        if: steps.token.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.cache-dir.outputs.path }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        env:
          STRICT_LOCKFILE: ${{ inputs.strict-lockfile }}
        run: |
          case "$NPM:$STRICT_LOCKFILE" in
            npm:true)   args=(ci) ;;
            npm:false)  args=(install) ;;
            pnpm:true)  args=(install --frozen-lockfile) ;;
            pnpm:false) args=(install --no-frozen-lockfile) ;;
          esac
          "$NPM" "${args[@]}"

      # Snyk exit codes: 0 clean, 1 issues found, anything else = the scan didn't complete.
      - name: Snyk Open Source test
        id: snyk-oss
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.snyk-token }}
          ALL_PROJECTS: ${{ steps.layout.outputs.all-projects }}
        run: |
          args=()
          [[ -n "$SNYK_ORG" ]] && args+=("--org=$SNYK_ORG")
          [[ "$ALL_PROJECTS" == "true" ]] && args+=(--all-projects --detection-depth=1)
          rc=0
          snyk test --sarif-file-output=snyk-oss.sarif --severity-threshold="$SEVERITY_THRESHOLD" "${args[@]}" || rc=$?
          echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
          if [[ $rc -gt 1 ]]; then
            echo "::error title=Snyk Open Source scan failed::snyk test exited with $rc: a scan error, not a finding."
          fi
          exit $rc

      - name: Publish dependency snapshot to Snyk
        id: snyk-monitor
        if: inputs.monitor && steps.token.outputs.present == 'true'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.snyk-token }}
          ALL_PROJECTS: ${{ steps.layout.outputs.all-projects }}
        run: |
          args=("--remote-repo-url=$REMOTE_REPO_URL" "--target-reference=$TARGET_REFERENCE")
          [[ -n "$SNYK_ORG" ]] && args+=("--org=$SNYK_ORG")
          [[ "$ALL_PROJECTS" == "true" ]] && args+=(--all-projects --detection-depth=1)
          snyk monitor "${args[@]}"

      # Snyk Code has no "critical" level, and needs --project-name with --report.
      - name: Snyk Code test
        id: snyk-code
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.snyk-token }}
          MONITOR: ${{ inputs.monitor }}
        run: |
          args=()
          [[ -n "$SNYK_ORG" ]] && args+=("--org=$SNYK_ORG")
          if [[ "$MONITOR" == "true" ]]; then
            args+=(--report "--remote-repo-url=$REMOTE_REPO_URL" "--target-reference=$TARGET_REFERENCE" "--project-name=$PROJECT_NAME")
          fi
          threshold="$SEVERITY_THRESHOLD"
          [[ "$threshold" == "critical" ]] && threshold=high
          rc=0
          snyk code test --sarif-file-output=snyk-code.sarif --severity-threshold="$threshold" "${args[@]}" || rc=$?
          echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
          if [[ $rc -gt 1 ]]; then
            echo "::error title=Snyk Code scan failed::snyk code test exited with $rc: a scan error, not a finding (is Snyk Code enabled in the org? does the token's role have View Project Ignores?)."
          fi
          exit $rc

      - name: Upload Open Source SARIF
        if: ${{ !cancelled() && hashFiles(format('{0}/snyk-oss.sarif', inputs.working-directory)) != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ inputs.working-directory }}/snyk-oss.sarif
          category: snyk-oss

      - name: Upload Code SARIF
        if: ${{ !cancelled() && hashFiles(format('{0}/snyk-code.sarif', inputs.working-directory)) != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ inputs.working-directory }}/snyk-code.sarif
          category: snyk-code

      - name: Comment summary on PR
        if: ${{ !cancelled() && steps.token.outputs.present == 'true' }}
        uses: actions/github-script@v9
        env:
          MARKER: "<!-- snyk-js-scan-summary -->"
          TITLE: Snyk scan
          THRESHOLD: ${{ inputs.severity-threshold }}
          SCANS: >-
            [{"label": "Open Source", "file": "${{ inputs.working-directory }}/snyk-oss.sarif", "outcome": "${{ steps.snyk-oss.outcome }}"},
             {"label": "Code (SAST)", "file": "${{ inputs.working-directory }}/snyk-code.sarif", "outcome": "${{ steps.snyk-code.outcome }}"}]
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            let pr = context.payload.pull_request?.number;
            if (!pr) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: context.sha });
              pr = data.find((p) => p.state === 'open')?.number;
            }
            if (!pr) { core.info('No open PR for this commit; skipping the comment.'); return; }

            const RANK = { low: 1, medium: 2, high: 3, critical: 4 };
            const threshold = process.env.THRESHOLD.toLowerCase();
            const floor = RANK[threshold] ?? 3;
            const byScore = (s) => (s >= 9 ? 'critical' : s >= 7 ? 'high' : s >= 4 ? 'medium' : s > 0 ? 'low' : null);
            const byLevel = { error: 'high', warning: 'medium', note: 'low', none: 'low' };

            // [] = clean, null = the scan didn't complete.
            const findings = (file, outcome) => {
              if (outcome === 'success') return [];
              if (!fs.existsSync(file)) return null;
              try {
                const out = [];
                for (const run of JSON.parse(fs.readFileSync(file, 'utf8')).runs || []) {
                  const rules = new Map((run.tool?.driver?.rules || []).map((r) => [r.id, r]));
                  for (const r of run.results || []) {
                    const rule = rules.get(r.ruleId);
                    const scored = byScore(parseFloat(rule?.properties?.['security-severity']));
                    if (scored && RANK[scored] < floor) continue;
                    const loc = r.locations?.[0]?.physicalLocation;
                    out.push({
                      sev: scored ?? byLevel[r.level ?? rule?.defaultConfiguration?.level ?? 'warning'],
                      rule: r.ruleId || '',
                      file: loc?.artifactLocation?.uri || '',
                      text: (r.message?.text || '').split('\n')[0],
                    });
                  }
                }
                return out.sort((a, b) => RANK[b.sev] - RANK[a.sev]);
              } catch (e) {
                core.warning(`Unreadable ${file}: ${e.message}`);
                return null;
              }
            };

            const scans = JSON.parse(process.env.SCANS).map((s) => ({ ...s, found: findings(s.file, s.outcome) }));
            const query = encodeURIComponent(context.payload.pull_request
              ? `is:open pr:${pr}` : `is:open branch:${context.ref.replace('refs/heads/', '')}`);
            const securityTab = `${context.serverUrl}/${owner}/${repo}/security/code-scanning?query=${query}`;
            const lines = [
              process.env.MARKER, `## ${process.env.TITLE}`, '',
              `Showing \`${threshold}\` and above. All findings are in the [Security tab](${securityTab}).`, '',
              '| Scan | Findings |', '| --- | ---: |',
              ...scans.map((s) => `| ${s.label} | ${s.found === null ? ':warning: did not complete' : s.found.length} |`),
            ];
            for (const s of scans) {
              if (!s.found?.length) continue;
              lines.push('', `<details><summary><b>${s.label}</b> (${s.found.length})</summary>`, '');
              for (const f of s.found.slice(0, 20)) {
                lines.push(`- \`${f.sev}\` ${f.rule}${f.file ? ` (\`${f.file}\`)` : ''}${f.text ? `: ${f.text}` : ''}`);
              }
              if (s.found.length > 20) lines.push(`- ...and ${s.found.length - 20} more`);
              lines.push('', '</details>');
            }
            const body = lines.join('\n');
            try {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr, per_page: 100 });
              const mine = comments.find((c) => c.body?.includes(process.env.MARKER));
              if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            } catch (e) {
              core.warning(`Could not post the Snyk comment (fork or Dependabot PR?): ${e.message}`);
            }

      - name: Quality gate
        if: inputs.fail-on-issues && (steps.snyk-oss.outcome == 'failure' || steps.snyk-code.outcome == 'failure')
        env:
          OSS: ${{ steps.snyk-oss.outputs.exit-code }}
          CODE: ${{ steps.snyk-code.outputs.exit-code }}
        run: |
          for pair in "Open Source:$OSS" "Code:$CODE"; do
            scan=${pair%%:*} rc=${pair#*:}
            case "$rc" in
              0) ;;
              1) echo "::error title=Snyk quality gate::Snyk $scan found issues at or above '$SEVERITY_THRESHOLD'." ;;
              *) echo "::error title=Snyk quality gate::Snyk $scan didn't complete (exit ${rc:-unknown}), so the gate can't pass." ;;
            esac
          done
          exit 1

      - name: Fail if publishing to Snyk failed
        if: ${{ !cancelled() && steps.snyk-monitor.outcome == 'failure' }}
        run: |
          echo "::error title=Snyk publish::snyk monitor couldn't publish the dependency snapshot."
          exit 1
